<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escribir Reseña | TikalCoffee</title>
    
    <!-- Google Fonts: Opción 1 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    
    <!-- Scripts: Tailwind + Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cazador': '#3A5A40', 
                        'helecho': '#588157', 
                        'salvia': '#A3B18A',  
                        'nieve': '#FAF9F6',   
                        'polvo': '#DAD7CD',
                    },
                    fontFamily: {
                        'titulo': ['Cormorant Garamond', 'serif'],
                        'cuerpo': ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { font-family: 'Montserrat', sans-serif; background-color: #DAD7CD; }
        .font-titulo { font-family: 'Cormorant Garamond', serif; }
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .lucide { width: 18px; height: 18px; stroke-width: 1.5px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-cazador italic font-bold">

    <!-- OVERLAY MÓVIL -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- SIDEBAR CLIENTE (Simetría Total) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-cazador text-polvo flex flex-col shadow-2xl transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0">
        <div class="p-6 border-b border-salvia/20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-xl"><i data-lucide="coffee"></i></div>
                <div>
                    <h1 class="font-titulo text-xl leading-none italic font-bold">TikalCoffee</h1>
                    <span class="text-[9px] opacity-60 uppercase tracking-widest font-bold font-cuerpo">Panel Viajero</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-salvia"><i data-lucide="x"></i></button>
        </div>
        
        <nav class="flex-1 p-4 mt-6 space-y-2">
            <a href="mis-reservas.html" class="flex items-center space-x-3 p-3 hover:bg-white/5 rounded-2xl transition group">
                <i data-lucide="backpack"></i> <span class="text-sm font-bold">Mis Reservas</span>
            </a>
            <a href="mi-perfil.html" class="flex items-center space-x-3 p-3 hover:bg-white/5 rounded-2xl transition group">
                <i data-lucide="user"></i> <span class="text-sm font-bold">Mi Perfil</span>
            </a>
            <!-- Link Activo: Reseña -->
            <a href="dejar-resena.html" class="flex items-center space-x-3 p-3 bg-white/10 rounded-2xl font-semibold border-l-4 border-salvia shadow-inner font-bold">
                <i data-lucide="message-square-plus"></i> <span class="text-sm font-bold">Escribir Reseña</span>
            </a>
            <a href="../../index.html" class="flex items-center space-x-3 p-3 hover:bg-white/5 rounded-2xl transition group">
                <i data-lucide="home"></i> <span class="text-sm font-bold">Volver al Inicio</span>
            </a>
        </nav>

        <div class="p-6 border-t border-salvia/20">
            <a href="../../index.html" class="flex items-center justify-center space-x-2 text-[10px] font-bold opacity-60 hover:opacity-100 p-3 bg-black/20 rounded-xl transition uppercase tracking-widest">
                <i data-lucide="log-out" class="w-3 h-3"></i> <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-polvo/50">
        
        <!-- HEADER (Simetría Total) -->
        <header class="bg-white h-20 px-6 md:px-8 flex justify-between items-center shadow-sm z-10 border-b border-salvia/10 italic font-bold">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl bg-polvo text-cazador"><i data-lucide="menu"></i></button>
                <h2 class="hidden md:block font-titulo text-2xl">Feedback de Experiencia</h2>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="hidden sm:block text-right">
                    <p class="text-[10px] font-bold text-salvia uppercase">Viajero</p>
                    <p class="text-xs font-bold">Ricardo Samayoa</p>
                </div>
                <div class="w-10 h-10 bg-helecho rounded-2xl flex items-center justify-center text-white font-titulo text-xl font-bold shadow-lg italic font-bold">R</div>
            </div>
        </header>

        <!-- CONTENIDO SCROLLABLE -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar italic font-bold">
            
            <div class="max-w-4xl mx-auto space-y-10">
                
                <!-- PASO 1: SELECCIONAR QUÉ CALIFICAR -->
                <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-sm border border-salvia/10">
                    <h3 class="text-2xl font-titulo text-cazador font-bold mb-8 italic font-bold underline decoration-salvia">1. Selecciona tu última aventura</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Opción 1 -->
                        <label class="relative flex items-center p-5 bg-nieve rounded-[2rem] border-2 border-helecho cursor-pointer group shadow-sm transition-all italic font-bold">
                            <input type="radio" name="service" class="hidden" checked>
                            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm mr-4 italic font-bold">
                                <i data-lucide="map" class="text-helecho"></i>
                            </div>
                            <div class="flex-1 italic font-bold">
                                <p class="text-sm font-bold text-cazador italic font-bold">Tour Amanecer en Tikal</p>
                                <p class="text-[9px] text-salvia font-bold uppercase italic font-bold italic font-bold">Finalizado: 20 Mayo, 2024</p>
                            </div>
                            <i data-lucide="check-circle" class="text-helecho w-5 h-5 italic font-bold"></i>
                        </label>

                        <!-- Opción 2 -->
                        <label class="relative flex items-center p-5 bg-white rounded-[2rem] border-2 border-transparent hover:border-salvia/30 cursor-pointer group shadow-sm transition-all italic font-bold">
                            <input type="radio" name="service" class="hidden">
                            <div class="w-12 h-12 bg-polvo/30 rounded-xl flex items-center justify-center mr-4 italic font-bold">
                                <i data-lucide="home" class="text-salvia"></i>
                            </div>
                            <div class="flex-1 italic font-bold">
                                <p class="text-sm font-bold text-gray-400 italic font-bold">Casa del Lago Premium</p>
                                <p class="text-[9px] text-gray-300 font-bold uppercase italic font-bold">Finalizado: 15 Mayo, 2024</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- PASO 2: FORMULARIO DE RESEÑA -->
                <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-salvia/10 italic font-bold">
                    <h3 class="text-2xl font-titulo text-cazador font-bold mb-10 italic underline decoration-salvia">2. Cuéntanos tu experiencia</h3>
                    
                    <form action="mis-reservas.html" class="space-y-10 italic font-bold">
                        <!-- Calificación Estrellas -->
                        <div class="flex flex-col items-center italic font-bold">
                            <p class="text-[10px] font-bold text-salvia uppercase tracking-widest mb-4 italic font-bold font-bold italic font-bold">Tu Calificación</p>
                            <div class="flex space-x-3 text-helecho italic font-bold">
                                <i data-lucide="star" class="w-8 h-8 fill-helecho italic font-bold"></i>
                                <i data-lucide="star" class="w-8 h-8 fill-helecho italic font-bold"></i>
                                <i data-lucide="star" class="w-8 h-8 fill-helecho italic font-bold"></i>
                                <i data-lucide="star" class="w-8 h-8 fill-helecho italic font-bold"></i>
                                <i data-lucide="star" class="w-8 h-8 opacity-20 italic font-bold"></i>
                            </div>
                        </div>

                        <!-- Comentario -->
                        <div class="group italic font-bold">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-4 tracking-widest italic font-bold">¿Qué te pareció el servicio y la atención del guía?</label>
                            <textarea rows="5" placeholder="Escribe aquí tus comentarios..." class="w-full bg-polvo/20 border-none rounded-[2rem] p-6 text-sm focus:ring-2 focus:ring-helecho/20 outline-none resize-none transition-all italic font-bold"></textarea>
                        </div>

                        <!-- Botón Enviar -->
                        <div class="flex justify-end italic font-bold">
                            <button type="submit" class="bg-helecho text-white px-12 py-4 rounded-2xl font-bold shadow-xl shadow-helecho/20 hover:bg-cazador transition-all transform hover:-translate-y-1 uppercase text-xs tracking-widest italic font-bold underline decoration-white/30">
                                PUBLICAR RESEÑA
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
