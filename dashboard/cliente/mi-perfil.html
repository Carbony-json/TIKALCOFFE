<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | TikalCoffee</title>
    
    <!-- Google Fonts: Opción 1 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    
    <!-- Scripts: Tailwind + Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cazador': '#3A5A40', 
                        'helecho': '#588157', 
                        'salvia': '#A3B18A',  
                        'nieve': '#FAF9F6',
                        'polvo': '#DAD7CD',
                    },
                    fontFamily: {
                        'titulo': ['Cormorant Garamond', 'serif'],
                        'cuerpo': ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { font-family: 'Montserrat', sans-serif; background-color: #FAF9F6; color: #3A5A40; }
        .font-titulo { font-family: 'Cormorant Garamond', serif; }
        .font-data { font-family: 'Montserrat', sans-serif; font-style: normal; }
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-cazador italic font-bold">

    <!-- OVERLAY MÓVIL -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- SIDEBAR (Simetría con Hub Central) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-cazador text-nieve flex flex-col shadow-2xl transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0">
        <div class="p-8 border-b border-salvia/20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-xl"><i data-lucide="coffee"></i></div>
                <div>
                    <h1 class="font-titulo text-xl leading-none italic font-bold">TikalCoffee</h1>
                    <span class="text-[9px] opacity-60 uppercase tracking-widest font-bold">Portal Viajero</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-salvia"><i data-lucide="x"></i></button>
        </div>
        
        <nav class="flex-1 p-4 mt-6 space-y-2 font-cuerpo">
            <a href="mis-reservas.html" class="flex items-center space-x-3 p-4 hover:bg-white/5 rounded-2xl transition group italic">
                <i data-lucide="layout-grid"></i> <span class="text-sm font-bold">Mi Bitácora</span>
            </a>
            <!-- Link Activo -->
            <a href="mi-perfil.html" class="flex items-center space-x-3 p-4 bg-white/10 rounded-2xl font-semibold border-l-4 border-salvia shadow-inner italic">
                <i data-lucide="user"></i> <span class="text-sm font-bold">Mi Perfil</span>
            </a>
            <a href="dejar-resena.html" class="flex items-center space-x-3 p-4 hover:bg-white/5 rounded-2xl transition group italic">
                <i data-lucide="message-square-plus"></i> <span class="text-sm font-bold">Escribir Reseña</span>
            </a>
            <a href="../../index.html" class="flex items-center space-x-3 p-4 hover:bg-white/5 rounded-2xl transition group italic">
                <i data-lucide="home"></i> <span class="text-sm font-bold">Regresar al Inicio</span>
            </a>
        </nav>

        <div class="p-6 border-t border-salvia/20">
            <a href="../../index.html" class="flex items-center justify-center space-x-2 text-[10px] font-bold opacity-60 hover:opacity-100 p-3 bg-black/20 rounded-xl transition uppercase tracking-widest">
                <i data-lucide="log-out" class="w-3 h-3"></i> <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-polvo/10">
        
        <!-- HEADER (Simetría Total) -->
        <header class="bg-white h-20 px-6 md:px-10 flex justify-between items-center shadow-sm z-10 border-b border-salvia/10 italic">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl bg-nieve text-cazador font-bold"><i data-lucide="menu"></i></button>
                <h2 class="hidden md:block font-titulo text-2xl">Configuración Personal</h2>
            </div>
            
            <div class="flex items-center space-x-4 italic">
                <div class="hidden sm:block text-right">
                    <p class="text-[9px] font-bold text-salvia uppercase">Ricardo Samayoa</p>
                    <p class="text-[9px] text-gray-400 italic">ID: #TK-8821</p>
                </div>
                <img src="https://i.pravatar.cc/150?u=ricardo" class="w-10 h-10 md:w-12 md:h-12 rounded-2xl border-2 border-helecho object-cover shadow-lg aspect-square">
            </div>
        </header>

        <!-- CONTENIDO SCROLLABLE -->
        <div class="flex-1 overflow-y-auto p-4 md:p-12 no-scrollbar italic font-bold">
            
            <div class="max-w-4xl mx-auto space-y-10">
                
                <!-- CABECERA DE PERFIL -->
                <div class="bg-white p-8 md:p-10 rounded-[3rem] shadow-sm border border-salvia/10 flex flex-col md:flex-row items-center gap-10">
                    <div class="relative group">
                        <img src="https://i.pravatar.cc/150?u=ricardo" class="w-32 h-32 rounded-[2.5rem] object-cover shadow-2xl border-4 border-nieve transition duration-500 group-hover:opacity-80">
                        <button class="absolute -bottom-2 -right-2 bg-helecho text-white p-3 rounded-2xl shadow-xl hover:bg-cazador transition-all">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="text-center md:text-left space-y-2">
                        <h3 class="text-4xl font-titulo text-cazador font-bold italic">Ricardo Samayoa</h3>
                        <p class="text-[10px] text-salvia font-bold uppercase tracking-[0.2em]">Viajero Premium TikalCoffee</p>
                        <div class="pt-4 flex justify-center md:justify-start">
                            <span class="px-4 py-1 bg-salvia/10 rounded-full text-[9px] font-bold text-cazador border border-salvia/20">DATOS VERIFICADOS</span>
                        </div>
                    </div>
                </div>

                <!-- FORMULARIO DE INFORMACIÓN -->
                <div class="bg-white p-8 md:p-12 rounded-[3rem] shadow-sm border border-salvia/10">
                    <div class="flex items-center space-x-3 mb-12 border-b border-polvo pb-6">
                        <i data-lucide="user-cog" class="text-helecho"></i>
                        <h4 class="text-2xl font-titulo text-cazador font-bold italic">Datos del Explorador</h4>
                    </div>
                    
                    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
                        <div class="group">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-1 tracking-widest italic font-bold">Nombre Completo</label>
                            <input type="text" value="Ricardo Samayoa" class="w-full bg-transparent border-b border-polvo focus:border-helecho py-3 outline-none transition-all italic text-sm text-gray-800">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-1 tracking-widest italic font-bold">Correo de Contacto</label>
                            <input type="email" value="ricardo@ejemplo.com" class="w-full bg-transparent border-b border-polvo focus:border-helecho py-3 outline-none transition-all italic text-sm text-gray-800">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-1 tracking-widest italic font-bold">WhatsApp</label>
                            <input type="tel" value="+502 4567-8910" class="w-full bg-transparent border-b border-polvo focus:border-helecho py-3 outline-none transition-all italic text-sm text-gray-800">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-1 tracking-widest italic font-bold">Nacionalidad</label>
                            <input type="text" value="Guatemala" class="w-full bg-transparent border-b border-polvo focus:border-helecho py-3 outline-none transition-all italic text-sm text-gray-800">
                        </div>

                        <!-- DIVISOR SEGURIDAD -->
                        <div class="md:col-span-2 pt-10 border-t border-polvo mt-6">
                            <div class="flex items-center space-x-2 mb-8 italic">
                                <i data-lucide="lock" class="text-helecho w-4 h-4"></i>
                                <h4 class="text-xs font-bold text-salvia uppercase tracking-widest italic font-bold">Seguridad de la Cuenta</h4>
                            </div>
                        </div>

                        <div class="group">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-1 tracking-widest italic font-bold">Nueva Contraseña</label>
                            <input type="password" placeholder="••••••••" class="w-full bg-transparent border-b border-polvo focus:border-helecho py-3 outline-none transition-all italic text-sm text-gray-800">
                        </div>
                        <div class="group">
                            <label class="block text-[10px] font-bold text-salvia uppercase mb-1 tracking-widest italic font-bold">Repetir Contraseña</label>
                            <input type="password" placeholder="••••••••" class="w-full bg-transparent border-b border-polvo focus:border-helecho py-3 outline-none transition-all italic text-sm text-gray-800">
                        </div>

                        <div class="md:col-span-2 flex justify-end pt-10">
                            <button type="submit" class="bg-helecho text-white px-12 py-4 rounded-2xl font-bold shadow-xl shadow-helecho/20 hover:bg-cazador transition transform hover:-translate-y-1 uppercase text-xs tracking-widest italic underline decoration-white/30">
                                Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
